# Chirpy site configuration
theme: jekyll-theme-chirpy
lang: zh-CN
timezone: Asia/Shanghai
title: Rebel's Blog
tagline: 用 Markdown 记录想法、学习与生活
description: 专注内容的个人博客
url: "https://rebellion-yong.github.io"
baseurl: ""
github:
  username: RebellioN-YonG
social:
  name: RebellioN-YonG
  links:
    - https://github.com/RebellioN-YonG
plugins:
  - jekyll-paginate
  - jekyll-archives

paginate: 10
paginate_path: /page/:num/
toc: true
theme_mode:
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
      mermaid: true
exclude:
  - work
  - outputs
  - README.md
  - LICENSE
  - publish.sh

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/
