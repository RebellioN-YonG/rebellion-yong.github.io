<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <style>
      body { max-width: 760px; margin: 3rem auto; padding: 0 1rem; font: 17px/1.8 system-ui, sans-serif; color: #222; }
      a { color: #06c; } pre { overflow-x: auto; padding: 1rem; background: #f5f5f5; }
      code { padding: .1em .3em; background: #f5f5f5; } img { max-width: 100%; }
      header { margin-bottom: 2rem; } footer { margin-top: 4rem; color: #777; font-size: .9em; }
    </style>
  </head>
  <body>
    <header><a href="{{ '/' | relative_url }}">{{ site.title }}</a></header>
    <main>{{ content }}</main>
    <footer>Powered by Markdown · GitHub Pages</footer>
  </body>
</html>
